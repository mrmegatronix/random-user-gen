<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <title>Random Username Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stage">
    <header class="top-bar">
      <span class="title">RANDOM USERNAME GENERATOR</span>
      <span class="clock" id="clock">
        <span id="hh">00</span><span class="colon">:</span><span id="mm">00</span><span class="colon">:</span><span id="ss">00</span>
      </span>
    </header>

    <main class="center">
      <div class="username-box">
        <div class="username fit-h1" id="username">loading...</div>
        <div class="subname" id="subname">—</div>
      </div>

      <div class="actions">
        <button id="btnGen" class="btn primary" type="button">GENERATE</button>
        <button id="btnCopy" class="btn" type="button">COPY</button>
      </div>
    </main>

    <footer class="footer">
      <span>SPACE / ENTER: NEW</span>
      <span>C: COPY</span>
    </footer>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="scripts/matrix-autofit.js"></script>
  <script src="app.js"></script>
</body>
</html>
